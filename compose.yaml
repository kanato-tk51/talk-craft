services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: talk_craft
      POSTGRES_USER: talk_craft
      POSTGRES_PASSWORD: talk_craft
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk_craft -d talk_craft"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - talk_craft_postgres:/var/lib/postgresql

volumes:
  talk_craft_postgres:
